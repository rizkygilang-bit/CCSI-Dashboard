name: Update Data from Google Sheets

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Fetch and parse data
        run: node scripts/fetch-data.js
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Auto-update data $(date -u +'%Y-%m-%d %H:%M UTC')"
          
          # Retry push hingga 3 kali kalau ada conflict
          for i in 1 2 3; do
            if git push; then
              echo "✅ Push berhasil"
              exit 0
            fi
            echo "⚠️ Push attempt $i gagal, pull dulu..."
            git pull --rebase origin main
            sleep 2
          done
          
          echo "❌ Push gagal setelah 3 percobaan"
          exit 1
